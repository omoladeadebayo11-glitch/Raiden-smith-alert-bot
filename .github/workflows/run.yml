name: coin-alerts

on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coin-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_MINUTES: "27"
          INTERVAL_SECONDS: "180"
      - name: Save state
        if: always()
        run: |
          git config user.name "coin-bot"
          git config user.email "coin-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase -q && git push)
